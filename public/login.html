<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · ZDX Book Studio</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand"><span class="brand-mark">ZDX</span><div><strong>Book Studio</strong><span>Private manuscript production</span></div></div>
      <h1>Sign in</h1>
      <p class="muted">Authorized accounts only.</p>
      <form id="loginForm">
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required /></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required /></div>
        <button type="submit" class="wide">Sign in</button>
      </form>
      <form id="changeForm" hidden>
        <div class="notice">Change the temporary password before entering the Studio.</div>
        <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="14" required /></div>
        <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="14" required /></div>
        <button type="submit" class="wide">Set password and continue</button>
      </form>
      <div id="loginMessage" class="login-message"></div>
    </section>
  </main>
  <script src="/login.js" type="module"></script>
</body>
</html>
