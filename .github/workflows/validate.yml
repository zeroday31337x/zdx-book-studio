name: Validate Book Studio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integration/cognito-access-control]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-studio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Tests
        run: npm test
